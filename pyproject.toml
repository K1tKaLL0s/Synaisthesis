[project]
name = "synaisthesis"
dynamic = ["version"]
description = "Human-governed, dual-model research orchestration platform with auditable verification loops and bidirectional Codex integration."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["research", "formal-verification", "lean", "z3", "governance", "mcp", "codex"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "basedpyright>=1.23",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
synaisthesis = "synaisthesis.interfaces.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/synaisthesis/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/synaisthesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
